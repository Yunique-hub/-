# 持续集成：PowerShell 脚本语法检查 + 静态检查 + 公共层自测
#
# 说明：完整的部署验证（verify.ps1）需要已构建的二进制、Chromium 运行时
# 和运行中的服务，CI 里不做 —— 那属于「部署后验证」。
# 这里只跑不需要运行时的部分，保证脚本本身是可用的。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

jobs:
  powershell-checks:
    name: PowerShell 脚本检查
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 显示 PowerShell 版本
        run: $PSVersionTable.PSVersion.ToString()
        shell: pwsh

      - name: 全部脚本语法检查
        shell: pwsh
        run: |
          $failed = @()
          Get-ChildItem -Path deploy, tests -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $failed += "$($_.Name): $($errors[0].Message) (行 $($errors[0].Extent.StartLineNumber))"
            } else {
              Write-Host "  OK  $($_.Name)"
            }
          }
          if ($failed.Count -gt 0) {
            Write-Host "语法检查失败：" -ForegroundColor Red
            $failed | ForEach-Object { Write-Host "  $_" -ForegroundColor Red }
            throw "有 $($failed.Count) 个脚本存在语法错误"
          }
          Write-Host "全部脚本语法检查通过" -ForegroundColor Green

      - name: 批处理文件换行符检查
        shell: pwsh
        run: |
          # .bat 必须是 CRLF —— 用 LF 的 .bat 在 cmd 里可能解析异常
          $bad = @()
          Get-ChildItem -Filter *.bat | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $text = [System.Text.Encoding]::UTF8.GetString($bytes)
            $lf = ([regex]::Matches($text, "(?<!`r)`n")).Count
            if ($lf -gt 0) { $bad += "$($_.Name)（有 $lf 个裸 LF）" }
          }
          if ($bad.Count -gt 0) { throw "以下 .bat 不是 CRLF 换行：$($bad -join ', ')" }
          Write-Host "全部 .bat 均为 CRLF" -ForegroundColor Green

      - name: 脚本静态检查
        shell: pwsh
        run: .\tests\test_scripts.ps1

      - name: 公共层单元自测
        shell: pwsh
        run: .\tests\test_common_selftest.ps1

      - name: 文档一致性检查
        shell: pwsh
        run: |
          # README 里列出的脚本必须真的存在
          $missing = @()
          foreach ($name in @(
            'deploy/bootstrap.ps1', 'deploy/build.ps1', 'deploy/start.ps1',
            'deploy/stop.ps1', 'deploy/status.ps1', 'deploy/verify.ps1',
            'deploy/reset-admin.ps1', 'deploy/install-service.ps1')) {
            if (-not (Test-Path $name)) { $missing += $name }
          }
          if ($missing.Count -gt 0) { throw "README 提到但实际缺失：$($missing -join ', ')" }

          foreach ($name in @(
            'docs/01-项目分析.md', 'docs/02-部署手册.md',
            'docs/03-使用说明.md', 'docs/04-验证报告.md')) {
            if (-not (Test-Path $name)) { throw "文档缺失：$name" }
          }
          Write-Host "文档与脚本一致性检查通过" -ForegroundColor Green